[entity-description]
fb-bus-pipe=Pipe for the main bus. Behaves like the original pipe and connects to ordinary pipes. Only BUS pipes accept a bus coupler. Recognize it by the spray-painted black "B".
fb-bus-coupler=Joins segments of BUS pipes into one network with an even fill level. Connects only to BUS pipes and needs electricity. Place it in the bus instead of a pump.

