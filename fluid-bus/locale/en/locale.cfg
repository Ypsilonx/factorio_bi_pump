fb-fluid-bus=BUS pipes and the bus coupler. Couplers join BUS pipe segments into one network with an even fill level.
fb-fluid-bus-pipe=BUS variant of this pipe for the main bus.

[virtual-signal-name]
fb-balance-interval=Bus balancing interval

[virtual-signal-description]
fb-balance-interval=Send a number N (1–600) to a bus coupler: its network is balanced every N ticks instead of the map setting. Several values in a network = the smallest wins.

[mod-setting-name]
fb-coupler-power=Bus coupler power (kW)
fb-balance-interval=Balancing interval (ticks)

[mod-setting-description]
fb-coupler-power=Constant power consumption of one bus coupler.
fb-balance-interval=How often the whole bus network is balanced. Lower = faster balancing, higher UPS cost.

