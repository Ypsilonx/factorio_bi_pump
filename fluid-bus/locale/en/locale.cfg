[mod-name]
fluid-bus=Fluid Bus

[mod-description]
fluid-bus=BUS variants of every pipe. Bus couplers join BUS pipe segments into one network with an even fill level.

[entity-name]
fb-bus-pipe=BUS: __1__
fb-bus-coupler=Bus coupler

[entity-description]
fb-bus-pipe=Pipe for the main bus. Behaves like the original pipe, but connects only to BUS pipes, bus couplers and pumps – connect ordinary pipes through a pump. Recognize it by the spray-painted black "B".
fb-bus-coupler=Joins segments of BUS pipes into one network with an even fill level. Connects only to BUS pipes and needs electricity. Place it in the bus instead of a pump. Circuit network: red wire = fluid amount, green wire = fill % and the fill of the coupler input and output (the input is the side with the arrow pointing in). Can be disabled by a condition (e.g. input > 50 = pass on only the surplus); the "Bus balancing interval" signal sets the interval of its network.

[item-description]
fb-bus-pipe=Pipe for the main bus. Behaves like the original pipe, but connects only to BUS pipes, bus couplers and pumps – connect ordinary pipes through a pump. Recognize it by the spray-painted black "B".
fb-bus-coupler=Joins segments of BUS pipes into one network with an even fill level. Connects only to BUS pipes and needs electricity. Place it in the bus instead of a pump. Circuit network: red wire = fluid amount, green wire = fill % and the fill of the coupler input and output (the input is the side with the arrow pointing in). Can be disabled by a condition (e.g. input > 50 = pass on only the surplus); the "Bus balancing interval" signal sets the interval of its network.

[technology-name]
fb-fluid-bus=Fluid bus
fb-fluid-bus-pipe=Fluid bus: __1__

[technology-description]
fb-fluid-bus=BUS pipes and the bus coupler. Couplers join BUS pipe segments into one network with an even fill level.
fb-fluid-bus-pipe=BUS variant of this pipe for the main bus.

[virtual-signal-name]
fb-balance-interval=Bus balancing interval
fb-input-fill=Bus coupler input fill
fb-output-fill=Bus coupler output fill

[virtual-signal-description]
fb-balance-interval=Send a number N (1–600) to a bus coupler: its network is balanced every N ticks instead of the map setting. Several values in a network = the smallest wins.
fb-input-fill=A bus coupler sends the fill % of the network on its input side (green wire), even while disabled. The coupler condition "input > 50" passes fluid on only when the input is more than half full.
fb-output-fill=A bus coupler sends the fill % of the network on its output side (green wire), even while disabled.

[mod-setting-name]
fb-coupler-power=Bus coupler power (kW)
fb-balance-interval=Balancing interval (ticks)

[mod-setting-description]
fb-coupler-power=Constant power consumption of one bus coupler.
fb-balance-interval=How often the whole bus network is balanced. Lower = faster balancing, higher UPS cost.

[fb-status]
ok=Bus: __1__ segments, __2__ %
no-power=No power
disabled=Disabled by circuit network
not-connected=Not connected to a BUS pipe
conflict=Different fluids in the bus network
