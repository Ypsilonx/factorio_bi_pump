[mod-name]
fluid-bus=Fluid Bus

[mod-description]
fluid-bus=BUS variants of every pipe. Bus couplers join BUS pipe segments into one network with an even fill level.

[entity-name]
fb-bus-pipe=BUS: __1__
fb-bus-coupler=Bus coupler

[entity-description]
fb-bus-pipe=Pipe for the main bus. Behaves like the original pipe, but connects only to BUS pipes, bus couplers and pumps – connect ordinary pipes through a pump. Recognize it by the spray-painted black "B".
fb-bus-coupler=Joins segments of BUS pipes into one network with an even fill level. Connects only to BUS pipes and needs electricity. Place it in the bus instead of a pump. Green wire: [fluid] = fill %. Can be disabled by a condition (e.g. [fluid] > 50 = pass on only the surplus); the "Bus balancing interval" signal sets the interval of its network.

