[entity-description]
fb-bus-pipe=Pipe for the main bus. Behaves like the original pipe, but connects only to BUS pipes, bus couplers and pumps – connect ordinary pipes through a pump. Recognize it by the spray-painted black "B". Can read the pipeline contents by wire like an ordinary pipe.
fb-bus-coupler=Joins segments of BUS pipes into one network with an even fill level. Connects only to BUS pipes and needs electricity. Place it in the bus instead of a pump. Sends nothing – a BUS pipe reads the bus contents by wire ("Read pipeline contents"). Can be disabled by a condition (wire from a BUS pipe in front of the coupler, e.g. [fluid] > 2500 for a 50-pipe segment = pass on only above 50 %); the "Bus balancing interval" signal sets the interval of its network.

