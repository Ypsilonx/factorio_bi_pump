[tips-and-tricks-item-description]
fluid-bus=Long pipelines are split by pumps into segments, and a pump pushes only one way at no more than 1200/s – the bus overfills in front of a pump and runs dry behind it.\n\nFluid Bus adds [font=default-bold]BUS variants of all pipes[/font] and the [entity=fb-bus-coupler] [font=default-bold]bus coupler[/font]. Couplers join the BUS pipe segments into one network and keep evening out their fill – the whole bus behaves like [font=default-bold]one tank[/font], no matter how long it is or where the inputs and outputs are.\n\nEverything is unlocked by the [font=default-bold]Fluid bus[/font] research.
fb-bus-pipes=Every pipe in the game (modded ones too) has a BUS variant with the same parameters, named "BUS: <pipe>" and marked with a [font=default-bold]black "B"[/font].\n\nA BUS pipe connects [font=default-bold]only to BUS pipes, the bus coupler and pumps[/font] – not to regular pipes, tanks or machines. Connect inputs and outputs with a [entity=pump] pump placed right on a BUS pipe; the pump also separates the branch, so it does not grow the bus segment.\n\nTo convert an existing bus, build BUS pipes over the regular ones (the fluid stays) or use the upgrade planner.
fb-coupler=[entity=fb-bus-coupler] Place the coupler in the bus [font=default-bold]instead of a pump[/font], facing along the bus, and connect it to power. It needs a BUS pipe on both sides.\n\nAll couplers linked by BUS pipes form one network. Every few ticks they even out the fill of all its segments – fluid also reaches upstream and there is no fixed flow cap.\n\nClick the coupler to open its window: number of segments in the network, fill, amount and power.
fb-status=Coupler light: [font=default-bold]green[/font] = working, [font=default-bold]yellow[/font] = low power or disabled by condition, [font=default-bold]red[/font] = no power.\n\nCommon mistakes:\n• [font=default-bold]Not connected to a BUS pipe[/font] – there is a regular pipe, another coupler or a pump next to the coupler. Put at least one BUS pipe between a coupler and a pump, and between two couplers.\n• [font=default-bold]Different fluids[/font] – each fluid needs its own bus.\n• Steam of different temperatures mixes in one network – keep steam from boilers and from heat exchangers apart.\n• A long branch without a pump grows the bus segment (320 tile limit).
fb-circuit=The coupler [font=default-bold]sends nothing[/font]. Read the bus contents by wire from a BUS pipe set to [font=default-bold]"Read pipeline contents"[/font] – it sends the amount in its whole segment. Couplers keep the segments at the same fill, so one pipe anywhere in the network is enough.\n\nFill % = amount / (pipes in the segment × 100) × 100. Example: 50 % of a 50-pipe segment is "[fluid] > 2500".\n\nThe coupler window has [font=default-bold]Enable/Disable[/font]. A wire from a BUS pipe in front of the coupler with a condition at half of that segment gives priority filling: fluid passes on only once the segment is half full.
fb-interval=How often the network is balanced is set by the map setting [font=default-bold]Balancing interval[/font] (default 5 ticks, can be changed during the game). A smaller interval = smaller swings between segments, but more work for the game.\n\nThe [virtual-signal=fb-balance-interval] signal with value N (1–600) sent to a coupler sets the interval for its network only – e.g. 60 at night when the bus stands still, 2 at peak.
