[mod-name]
fluid-bus=Fluid Bus

[mod-description]
fluid-bus=BUS varianty všech trubek. Spojky busu propojí segmenty BUS trubek do jedné sítě se stejným naplněním.

[entity-name]
fb-bus-pipe=BUS: __1__
fb-bus-coupler=Spojka busu

[entity-description]
fb-bus-pipe=Trubka pro hlavní bus. Chová se jako původní trubka, ale napojí se jen na BUS trubky, spojku busu a pumpu – běžné potrubí připoj přes pumpu. Poznáš ji podle nastříkaného černého „B“.
fb-bus-coupler=Propojí segmenty BUS trubek do jedné sítě se stejným naplněním. Napojí se jen na BUS trubky a potřebuje elektřinu. Postav ji do busu místo pumpy. Zelený drát: [kapalina] = naplnění v %. Podmínkou ji lze vypnout (např. [kapalina] > 50 = pouštět dál jen přebytek), signálem „Interval vyrovnávání busu“ nastavit interval sítě.

[item-description]
fb-bus-pipe=Trubka pro hlavní bus. Chová se jako původní trubka, ale napojí se jen na BUS trubky, spojku busu a pumpu – běžné potrubí připoj přes pumpu. Poznáš ji podle nastříkaného černého „B“.
fb-bus-coupler=Propojí segmenty BUS trubek do jedné sítě se stejným naplněním. Napojí se jen na BUS trubky a potřebuje elektřinu. Postav ji do busu místo pumpy. Zelený drát: [kapalina] = naplnění v %. Podmínkou ji lze vypnout (např. [kapalina] > 50 = pouštět dál jen přebytek), signálem „Interval vyrovnávání busu“ nastavit interval sítě.

