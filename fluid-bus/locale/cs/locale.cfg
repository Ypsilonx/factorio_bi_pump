[technology-description]
fb-fluid-bus=BUS trubky a spojka busu. Spojky propojí segmenty BUS trubek do jedné sítě se stejným naplněním.
fb-fluid-bus-pipe=BUS varianta této trubky pro hlavní bus.

[virtual-signal-name]
fb-balance-interval=Interval vyrovnávání busu

[virtual-signal-description]
fb-balance-interval=Pošli do spojky busu číslo N (1–600): její síť se bude vyrovnávat každých N ticků místo nastavení mapy. Více hodnot v síti = platí nejmenší.

[mod-setting-name]
fb-coupler-power=Odběr spojky busu (kW)
fb-balance-interval=Interval vyrovnávání (ticky)

[mod-setting-description]
fb-coupler-power=Stálý odběr elektřiny jedné spojky busu.
fb-balance-interval=Jak často se vyrovná celá síť busu. Menší = rychlejší vyrovnání, vyšší zátěž UPS.

[fb-status]
ok=Bus: __1__ segmentů, __2__ %
