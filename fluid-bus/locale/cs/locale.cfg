[tips-and-tricks-item-description]
fluid-bus=Dlouhé potrubí se dělí pumpami na segmenty a pumpa tlačí jen jedním směrem a nejvýš 1200/s – před pumpou se bus přeplní a za ní chybí kapalina.\n\nFluid Bus přidává [font=default-bold]BUS varianty všech trubek[/font] a [entity=fb-bus-coupler] [font=default-bold]spojku busu[/font]. Spojky propojí segmenty BUS trubek do jedné sítě a průběžně jim srovnávají naplnění – celý bus se chová jako [font=default-bold]jedna nádrž[/font], bez ohledu na délku a na to, kde jsou vstupy a výstupy.\n\nVše odemkne výzkum [font=default-bold]Kapalinový bus[/font].
fb-bus-pipes=Každá trubka ve hře (i z modů) má BUS variantu se stejnými parametry, jmenuje se „BUS: <trubka>“ a pozná se podle [font=default-bold]černého „B“[/font].\n\nBUS trubka se napojí [font=default-bold]jen na BUS trubky, spojku busu a pumpu[/font] – na běžnou trubku, nádrž ani stroj ne. Vstupy a výstupy proto připoj [entity=pump] pumpou přímo na BUS trubku; pumpa zároveň odbočku oddělí, takže nezvětšuje segment busu.\n\nStávající bus přestavíš postavením BUS trubky přes běžnou (kapalina zůstane) nebo upgrade plannerem.
fb-coupler=[entity=fb-bus-coupler] Spojku postav do busu [font=default-bold]místo pumpy[/font], natočenou po směru busu, a připoj ji k elektřině. Na obou stranách musí mít BUS trubku.\n\nVšechny spojky propojené přes BUS trubky tvoří jednu síť. Každých pár ticků srovnají naplnění všech jejích segmentů – kapalina se tak dostane i proti proudu a průtok nemá pevný strop.\n\nKliknutím otevřeš okno spojky: počet segmentů sítě, naplnění, množství a elektřina.
fb-status=Kontrolka spojky: [font=default-bold]zelená[/font] = pracuje, [font=default-bold]žlutá[/font] = málo proudu nebo vypnuto podmínkou, [font=default-bold]červená[/font] = bez proudu.\n\nČasté chyby:\n• [font=default-bold]Nepřipojeno k BUS trubce[/font] – u spojky je běžná trubka, jiná spojka nebo pumpa. Mezi spojku a pumpu i mezi dvě spojky patří aspoň jedna BUS trubka.\n• [font=default-bold]Různé kapaliny[/font] – každá kapalina potřebuje vlastní bus.\n• Pára různých teplot se v jedné síti smíchá – páru z kotlů a z výměníků veď zvlášť.\n• Dlouhá odbočka bez pumpy zvětšuje segment busu (limit 320 políček).
fb-circuit=Spojka [font=default-bold]nic nevysílá[/font]. Obsah busu čti drátem z BUS trubky v režimu [font=default-bold]„Číst obsah potrubí“[/font] – pošle množství v celém svém segmentu. Spojky drží segmenty na stejném naplnění, takže stačí jedna trubka kdekoli v síti.\n\nNaplnění v % = množství / (počet trubek segmentu × 100) × 100. Příklad: 50 % u segmentu z 50 trubek je „[kapalina] > 2500“.\n\nV okně spojky jde nastavit [font=default-bold]Povolit/Zakázat[/font]. Drát z BUS trubky před spojkou s podmínkou na polovinu segmentu dá přednostní plnění: dál se pouští, až když je segment z poloviny plný.
fb-interval=Jak často se síť vyrovnává, určuje nastavení mapy [font=default-bold]Interval vyrovnávání[/font] (výchozí 5 ticků, mění se za běhu). Menší interval = menší výkyvy mezi segmenty, ale víc práce pro hru.\n\nSignál [virtual-signal=fb-balance-interval] s hodnotou N (1–600) poslaný do spojky nastaví interval jen její síti – např. 60 v noci, kdy bus stojí, a 2 při špičce.
