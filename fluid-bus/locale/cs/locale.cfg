enable=Povolit/Zakázat
enable-tooltip=Spojka spojuje strany jen při splněné podmínce. Signál přiveď drátem – typicky z BUS trubky v segmentu před spojkou v režimu „Číst obsah potrubí“ (množství kapaliny v segmentu).
read-hint=Spojka nic nevysílá. Obsah busu čti drátem z BUS trubky: „Číst obsah potrubí“ = množství v jejím segmentu. Naplnění v % = množství / (počet trubek segmentu × 100) × 100. Na jednu obvodovou síť stačí jedna čtecí trubka – signály více trubek se sčítají.
